---
# Linea-ONLY state-mate extras — run for Linea IN ADDITION TO the shared config/state/l2.yaml.
# Linea's pre-migration system also ran a Gelato keeper (the other three lanes never did), which the
# Stage-2 migration must de-role. This is the one genuinely Linea-specific L2 assertion, so it lives
# here rather than as a placeholder in the universal shared wiring.
#
# The de-role is already enforced/verified in Solidity (migration revert-on-fail post-condition in
# script/shared/L2UpgradeActions.s.sol, the UpgradeTestBase._verifyOldAutomationsRevoked() forge
# assertion, and a functional sync-rejection test); this is the independent post-go-live oracle.
#
# state-mate requires FULL ABI coverage for a contract's `checks:`, so every CustomSenderReferral
# view function is listed; all are covered-but-skipped (null) except the one Gelato hasRole entry —
# the full CustomSender state is asserted by the shared config/state/l2.yaml run.
#
# Siblings auto-discovered by basename: l2-linea-extras.{inputs,deployed}.yaml. ABIs: ./abi.
roles:
  - &SYNC_ROLE "0xbb1ef2b79fa8154a13ffa50bd30e5f91ed93ff9b924bd04be671240cbc9d4b71"

l1:
  rpcUrl: L1_RPC_URL
  contracts: {}

l2:
  rpcUrl: L2_STATE_MATE_RPC_URL
  chainId: 59144
  contracts:
    customSender:
      name: CustomSenderReferral
      address: *l2CustomSender
      checks:
        # The only real assertion: Linea's old Gelato keeper no longer holds SYNC_ROLE post-migration.
        hasRole:
          - args: [*SYNC_ROLE, *l2OldGelatoSyncAutomation]
            result: false
        # Remaining CustomSenderReferral view functions — covered-but-skipped (asserted by l2.yaml).
        CCIP_ROUTER: null
        DEFAULT_ADMIN_ROLE: null
        LINK_TOKEN: null
        MIN_PROCESS_MESSAGE_GAS: null
        SYNC_ROLE: null
        TOKEN: null
        WNATIVE: null
        getOraclePool: null
        getReceiver: null
        supportsInterface: null
