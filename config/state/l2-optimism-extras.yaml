---
# Optimism-ONLY state-mate extras — run for Optimism IN ADDITION TO the shared config/state/l2.yaml.
#
# WHAT THIS ASSERTS: that the RETIRED (v1) automation pair is UNPLUGGED. On 2026-07-29 Optimism's
# automation layer was redeployed under the Automation Owner (docs/automation-owner-redeploy.md §S3);
# the superseded SyncTrigger + CREReceiver still exist on-chain, are still LOL-owned, and — until the
# §S6 cutover runs — the retired trigger still holds SYNC_ROLE. That last fact is the one that matters:
# while it holds, the LOL multisig retains a live automation capability (it can `setForwarder` on the
# retired trigger to itself and call `triggerSync` directly), which is exactly the coupling the new
# ownership split exists to break. So this is not tidy-up bookkeeping — it is the continuous oracle for
# a load-bearing revoke, and it lives here rather than in a runbook checkbox so it is re-verified on
# every state-mate run instead of remembered.
#
# ⚠ THIS CONFIG IS EXPECTED TO FAIL UNTIL THE CUTOVER COMPLETES. Two rows are red today, by design:
#     customSender.hasRole(SYNC_ROLE, retired trigger)   → needs §S6 (Initial Owner: grant v2 / revoke v1)
#     retiredCreReceiver.isCallAllowed(retired trigger)  → needs §6 "D1" (LOL Safe: setAllowedCall false)
#   A green run is the gate, not the starting state.
#
# WHY A SEPARATE CONFIG. The shared l2.yaml is run for all four lanes and only Optimism has a retired
# pair, so its addresses cannot be aliased there (state-mate requires every alias to resolve on every
# run, and every .deployed label to be referenced by the main config). Same reason and same shape as
# Linea's one-lane Gelato de-role in l2-linea-extras.yaml. When all four lanes have been redeployed,
# fold these three contracts into l2.yaml and delete this file.
#
# WHY THE IDENTITY CHECKS ARE NOT PADDING. `hasRole(...) == false` passes trivially for ANY address
# that never held the role — a mistyped anchor would make the whole config green while the real retired
# trigger stayed armed (the same silent-no-op class that OZ `revokeRole` has). The SENDER /
# DEST_CHAIN_SELECTOR / getForwarder / owner rows below are what prove the pinned addresses ARE this
# lane's retired pair, so the de-role assertion is about the right contract. They are the reason these
# two anchors need no MigrationConstants.sol pin: their identity is proven on-chain, not by a copy.
#
# state-mate requires FULL ABI coverage for a contract's `checks:`, so every view function is listed;
# the ones the shared l2.yaml already asserts (or that carry no stable equality) are covered-but-skipped
# (null). Siblings auto-discovered by basename: l2-optimism-extras.{inputs,deployed}.yaml. ABIs: ./abi.
roles:
  - &SYNC_ROLE "0xbb1ef2b79fa8154a13ffa50bd30e5f91ed93ff9b924bd04be671240cbc9d4b71"

l1:
  rpcUrl: L1_RPC_URL
  contracts: {}

l2:
  rpcUrl: L2_STATE_MATE_RPC_URL
  chainId: 10
  contracts:
    customSender:
      name: CustomSenderReferral
      address: *l2CustomSender
      checks:
        # THE load-bearing assertion: the retired SyncTrigger can no longer make CustomSender sync.
        # With this false, the retired pair is inert end-to-end — `triggerSync` reverts inside
        # CustomSender regardless of the retired receiver's forwarder, author or allow-list.
        hasRole:
          - args: [*SYNC_ROLE, *l2RetiredSyncTrigger]
            result: false
        # Remaining CustomSenderReferral view functions — covered-but-skipped (asserted by l2.yaml).
        CCIP_ROUTER: null
        DEFAULT_ADMIN_ROLE: null
        LINK_TOKEN: null
        MIN_PROCESS_MESSAGE_GAS: null
        SYNC_ROLE: null
        TOKEN: null
        WNATIVE: null
        getOraclePool: null
        getReceiver: null
        supportsInterface: null

    # Retired v1 SyncTrigger — kept as the de-roled cold spare (§6 "D1"): if the Automation Owner key
    # is ever lost, recovery is "re-grant SYNC_ROLE to a live trigger", and this production-configured
    # LOL-owned one already exists. Harmless only because the row above holds.
    retiredSyncTrigger:
      name: SyncTrigger
      address: *l2RetiredSyncTrigger
      checks:
        # Identity: these three immutables are constructor-set and unchangeable, so together they prove
        # this address is THIS lane's retired trigger and not an unrelated (or mistyped) contract.
        SENDER: *l2CustomSender
        DEST_CHAIN_SELECTOR: *ethMainnetCcipChainSelector
        WNATIVE: *l2Weth
        # Still points at the retired receiver — i.e. it was NOT re-pointed at the live v2 receiver or
        # at an EOA. `setForwarder` is owner-only, so a change here means the LOL multisig moved it.
        getForwarder: *l2RetiredCreReceiver
        # D1 keeps LOL as owner (D2 would renounce to 0x0…0 — see the .inputs sibling).
        owner: *l2LiquidityOwner
        # Operational parameters are deliberately NOT pinned: the retired trigger is de-roled, so its
        # delay/amounts/fees can no longer affect anything, and pinning them would turn a harmless
        # owner tweak into a red run. Its inertness rests on SYNC_ROLE alone.
        getDelay: null
        getAmounts: null
        getFeeOtoD: null
        getFeeDtoO: null
        getMaxFees: null
        getMaxGasLimit: null
        getLastExecution: null # frozen at deploy; never executed
        MIN_DELAY: null # immutable floor, asserted on the live trigger by l2.yaml
        shouldSyncAmount: null # reads the LIVE pool's WETH balance, so it drifts — no stable equality
        canSync: null # reads the fee float (0 here), same drift rationale

    # Retired v1 CREReceiver — the dispatch half of the retired pair.
    retiredCreReceiver:
      name: CREReceiver
      address: *l2RetiredCreReceiver
      checks:
        # Defence in depth beyond the SYNC_ROLE revoke: with the allow-list entry cleared, the retired
        # receiver cannot dispatch `triggerSync()` even if SYNC_ROLE were ever re-granted to the retired
        # trigger by a future admin. This is the §6 "D1" neutralization; it needs one LOL Safe
        # transaction (setAllowedCall(trigger, 0x340b2b0b, false)) and is RED until that lands.
        isCallAllowed:
          - args: [*l2RetiredSyncTrigger, "0x340b2b0b"] # triggerSync()
            result: false
        owner: *l2LiquidityOwner
        # Unchanged from the original deploy — recorded so a silent re-wiring of the retired receiver
        # (both are owner-only setters) shows up as a red row rather than going unnoticed.
        getForwarder: *l2CreForwarder
        getExpectedAuthor: *l2LiquidityOwner
        supportsInterface: null # ERC-165 ids are asserted on the live receiver by l2.yaml
