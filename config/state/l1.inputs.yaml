---
# Single review surface for the L1 (Ethereum mainnet) verification parameters (sibling of
# l1.yaml). Mirrors script/l1/L1MigrationConstants.sol + the per-net constants; kept in
# lockstep by `just verify-constants-sync`; the wiring config's `checks:` cross-check each vs chain.
# (ethMainnetCcipChainSelector is intentionally absent — it is not read in any L1 check; it is
#  cross-checked via the per-L2 inputs, where it IS referenced.)
config:
  - &minFailedMessageGas 45000 # LidoCustomReceiver.MIN_FAILED_MESSAGE_GAS (CCIPDefensiveReceiver immutable)

externals:
  # ── CCIP chain selectors for the four L2 lanes (Ethereum is their sync destination) ──
  - &optimismCcipChainSelector 3734403246176062136
  - &arbitrumCcipChainSelector 4949039107694359620
  - &baseCcipChainSelector 15971525489660198786
  - &lineaCcipChainSelector 4627098889531055414
  # ── Owners (L1 shared) ──
  - &lidoDaoAgent "0x3e40D73EB977Dc6a537aF587D48316feE66E9C8c"
  - &initialOwner "0xb5c336a5c60D3482b29d83C742C65AE8351b91a8"
  # ── L1 contracts under verification — PRE-EXISTING upstream (chainlink-csr) deploy. This migration
  #    adopts them and only rotates ownership (Stage-2); it deploys nothing on L1, so they are fixed
  #    external facts, identical on a mainnet fork and on mainnet — NOT deploy outputs. The receiver is
  #    a TransparentUpgradeableProxy (hence the separate implementation + ProxyAdmin). ──
  - &l1LidoCustomReceiver "0x6F357d53d6bE3238180316BA5F8f11467e164588"
  - &l1LidoCustomReceiverImpl "0x301cBCDA894c932E9EDa3Cf8878f78304e69E367"
  - &l1ProxyAdmin "0x88a45d2760b63c1500E3D2E3552b28e5Cdaa37BD"
  # ── L1 immutables surfaced on LidoCustomReceiver ──
  - &l1Weth "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2"
  - &l1Wsteth "0x7f39C581F595B53c5cb19bD0b3f8dA6c935E2Ca0"
  - &l1CcipRouter "0x80226fc0Ee2b096224EeAc085Bb9a8cba1146f7D"
  # ── Per-lane L1 bridge infra (external — not Lido-deployed) + per-chain L2 wstETH targets ──
  - &l1OptimismStandardBridge "0x76943C0D61395d8F2edF9060e1533529cAe05dE6"
  - &l1BaseStandardBridge "0x9de443AdC5A411E83F1878Ef24C3F52C61571e72"
  - &l1ArbitrumGatewayRouter "0x72Ce9c846789fdB6fC1f34aC4AD25Dd9ef7031ef"
  - &l1ArbitrumTokenGateway "0x0F25c1DC2a9922304f2eac71DCa9B07E310e8E5a"
  - &l1LineaTokenBridge "0x051F1D88f0aF5763fB888eC4378b4D8B29ea3319"
  - &l2OptimismWsteth "0x1F32b1c2345538c0c6f582fCB022739c4A194Ebb"
  - &l2BaseWsteth "0xc1CBa3fCea344f92D9239c08C0568f6F2F0ee452"
  # ── L1 adapters per lane (CustomReceiver.getAdapter(selector) → adapter) ──
  - &l1OptimismAdapter "0x328de900860816d29D1367F6903a24D8ed40C997"
  - &l1ArbitrumAdapter "0xBf96561e4519182CFA4cebBf95494D9CA5a316f9"
  - &l1BaseAdapter "0x9c27c304cFdf0D9177002ff186A4aE0A5489Aace"
