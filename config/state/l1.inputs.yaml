  - &l2ArbitrumSenderBytes32 "0x00000000000000000000000072229141d4b016682d3618ece47c046f30da4ad1"
  - &l2BaseSenderBytes32 "0x000000000000000000000000328de900860816d29d1367f6903a24d8ed40c997"
  - &l2LineaSenderBytes32 "0x000000000000000000000000328de900860816d29d1367f6903a24d8ed40c997"
