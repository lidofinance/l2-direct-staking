---
# Static .deployed sibling of l2-linea-extras.yaml. UNLIKE the per-lane l2-<net>.deployed.yaml files
# (generated by 'just deploy-stage1' from each fork's fresh deploy outputs), this one is hand-written
# and committed: it pins the single pre-existing contract the Linea-only extras config reads — the
# upstream CustomSenderReferral proxy. Its address is deterministic, identical on a fork and on Linea
# mainnet, so the extras run needs no per-fork --deployed override. Pinned to
# LineaMigrationConstants.L2_CUSTOM_SENDER by 'just verify-constants-sync'. This file supplies the
# schema-required `deployed:` section and resolves the *l2CustomSender alias in the wiring config.
deployed:
  l1: [] # L2-only config; the L1 receiver is verified by l1.yaml.
  l2:
    - &l2CustomSender "0x328de900860816d29D1367F6903a24D8ed40C997"
