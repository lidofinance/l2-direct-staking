---
# .deployed sibling of l2-optimism-extras.yaml — the RETIRED (v1) automation pair, superseded on
# 2026-07-29 when `just deploy-automation` deployed the v2 pair under the Automation Owner.
#
# WHY THESE ADDRESSES ARE NOT IN l2-optimism.deployed.yaml, despite being outputs of this migration:
# state-mate rejects any `.deployed` label the MAIN config never references
# (lib/state-mate/src/sibling-delegation.ts, "label(s) in the .deployed file are never referenced in
# the main config"). The main config is the SHARED config/state/l2.yaml, run for all four lanes — and
# Arbitrum / Base / Linea have no retired pair yet, so an alias there would be unresolvable on three
# of four lanes. The retired pair is therefore delegated to this lane-scoped extras run, exactly as
# Linea's one-lane Gelato de-role is (l2-linea-extras.*). Fold these anchors back into the per-lane
# .inputs/.deployed files and the shared wiring once ALL FOUR lanes have been redeployed.
#
# Hand-written and committed (NOT generated by `just deploy-automation`, which emits only the live
# trio): once a pair is retired its addresses are frozen history, and pinning them here is what makes
# the "unplugged" assertions in the wiring config a real, continuously re-verified claim rather than
# something an operator has to remember. The CustomSender the SYNC_ROLE is read off is the upstream
# proxy, pinned to OptimismMigrationConstants.L2_CUSTOM_SENDER by `just verify-constants-sync` — same
# treatment as l2-linea-extras.deployed.yaml.
deployed:
  l1: [] # L2-only config; the L1 receiver is verified by l1.yaml.
  l2:
    - &l2CustomSender "0x328de900860816d29D1367F6903a24D8ed40C997"
    - &l2RetiredSyncTrigger "0x1594705D5f9BbDb36453ACF15C94d041c0E02c62"
    - &l2RetiredCreReceiver "0x29113eD7AE4C97Ee2F20A5511C852aa37C0d6b85"
