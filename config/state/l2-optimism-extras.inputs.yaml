---
# .inputs sibling of l2-optimism-extras.yaml. Holds the third-party / owner facts the retired-pair
# assertions read; the contract addresses themselves live in the .deployed sibling. Every value here
# is a copy of the identically-named anchor in l2-optimism.inputs.yaml (a separate state-mate run
# cannot share siblings with the main one), and `just verify-constants-sync` pins both copies to the
# same OptimismMigrationConstants source of truth, so they cannot drift apart silently.
config:
  - &ethMainnetCcipChainSelector 5009297550715157269

externals:
  # The retired pair is left OWNED by the LOL multisig — the §6 "D1" disposition (neutralize, keep
  # ownership), which preserves a de-roled cold spare. If the disposition is ever changed to D2
  # (renounceOwnership on both), these two owner rows become 0x0…0 and must be updated together.
  - &l2LiquidityOwner "0xFc832dA3D688352C0aB1A32136c7fABbB16d66E6"
  - &l2CreForwarder "0xF8344CFd5c43616a4366C34E3EEE75af79a74482"
  - &l2Weth "0x4200000000000000000000000000000000000006"
