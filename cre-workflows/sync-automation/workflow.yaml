# One production workflow serves every lane in config.deploy.json.
# Changing workflow-name changes registration identity.
simulate-settings:
  user-workflow:
    workflow-name: "lido-sync-automation-simulate"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.simulate.json"
    secrets-path: ""

production:
  user-workflow:
    workflow-name: "direct-staking-sync"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.deploy.json"
    secrets-path: ""
