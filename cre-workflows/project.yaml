# ==========================================================================
# CRE PROJECT SETTINGS FILE
# ==========================================================================
# Project-specific settings for CRE CLI targets, in the schema of the pinned CLI (CRE_CLI_VERSION in the
# justfile, v1.27.0): per target an `rpcs` group, and optionally an `account` group.
#
# `${VAR}` interpolation works in **rpc `url` fields only** — the CLI does not expand it in other
# settings. The values here come from the environment via script/shared/cre-env.sh, which the
# `just cre …` and `just deploy-cre-workflow` recipes source:
#   ${L1_RPC_URL}              Ethereum mainnet — bound to ${RPC_ETHEREUM_REMOTE}
#   ${L2_<NET>_RPC_URL}        each L2 lane     — bound to ${RPC_<NET>_REMOTE}
#
# The consolidated production owner is the linked Test Automation Safe. The CLI cannot interpolate an
# owner address, so the production target carries that literal and deploy-cre-workflow always emits an
# unsigned transaction for the Safe. The retained per-lane targets still derive their old EOA owner
# from CRE_ETH_PRIVATE_KEY when they are used for retirement commands.
#
# Two schema notes for whoever bumps the CLI:
#   • the older `cre-cli: don-family: "zone-a"` block here was REMOVED — v1.27.0 has no `don-family`
#     (nor any `cre-cli`) settings key, so it was silently ignored. The DON family is read from the
#     `CRE_CLI_DON_FAMILY` environment variable instead, which cre-env.sh sets.
#   • unrecognized keys do NOT fail the load, which is why stale ones are deleted rather than left as
#     decoration: config that looks live but is ignored is worse than no config.

# ==========================================================================
default: &default
  rpcs: &rpcs
    - chain-name: ethereum-mainnet-optimism-1
      url: "${L2_RPC_URL}"
    - chain-name: ethereum-mainnet
      url: "${L1_RPC_URL}"

# ==========================================================================
simulate-settings: *default

# ==========================================================================
test-settings: *default

# ==========================================================================
# Consolidated production target: the workflow creates one EVM client per `lanes[]` entry, so all four
# RPCs must be present in one target. cre-env.sh derives these aliases from the root RPC_<NET>_REMOTE
# bindings before deploy-cre-workflow invokes the CLI.
production:
  account:
    workflow-owner-address: "0xede1750ac52156e10be2b41d8b8df816d58bafe1"
  rpcs:
    - chain-name: ethereum-mainnet-optimism-1
      url: "${L2_OPTIMISM_RPC_URL}"
    - chain-name: ethereum-mainnet-arbitrum-1
      url: "${L2_ARBITRUM_RPC_URL}"
    - chain-name: ethereum-mainnet-base-1
      url: "${L2_BASE_RPC_URL}"
    - chain-name: ethereum-mainnet-linea-1
      url: "${L2_LINEA_RPC_URL}"
    - chain-name: ethereum-mainnet
      url: "${L1_RPC_URL}"

# ==========================================================================
# Retained per-lane targets. They remain available only to pause or delete the old registrations.
#
production-optimism:
  rpcs:
    - chain-name: ethereum-mainnet-optimism-1
      url: "${L2_RPC_URL}"
    - chain-name: ethereum-mainnet
      url: "${L1_RPC_URL}"

production-arbitrum:
  rpcs:
    - chain-name: ethereum-mainnet-arbitrum-1
      url: "${L2_RPC_URL}"
    - chain-name: ethereum-mainnet
      url: "${L1_RPC_URL}"

production-base:
  rpcs:
    - chain-name: ethereum-mainnet-base-1
      url: "${L2_RPC_URL}"
    - chain-name: ethereum-mainnet
      url: "${L1_RPC_URL}"

production-linea:
  rpcs:
    - chain-name: ethereum-mainnet-linea-1
      url: "${L2_RPC_URL}"
    - chain-name: ethereum-mainnet
      url: "${L1_RPC_URL}"
