# CRE CLI targets. RPC URL interpolation is provided by script/shared/cre-env.sh.
# Production registration uses unsigned calldata executed by the Automation Multisig.
# CRE_CLI_DON_FAMILY is supplied through the environment.
default: &default
  rpcs:
    - chain-name: ethereum-mainnet-optimism-1
      url: "${L2_RPC_URL}"
    - chain-name: ethereum-mainnet
      url: "${L1_RPC_URL}"

simulate-settings: *default
test-settings: *default

production:
  account:
    workflow-owner-address: "0x23ac4bf8ca7345ee533b12705af40f69060d9b5b"
  rpcs:
    - chain-name: ethereum-mainnet-optimism-1
      url: "${L2_OPTIMISM_RPC_URL}"
    - chain-name: ethereum-mainnet-arbitrum-1
      url: "${L2_ARBITRUM_RPC_URL}"
    - chain-name: ethereum-mainnet-base-1
      url: "${L2_BASE_RPC_URL}"
    - chain-name: ethereum-mainnet-linea-1
      url: "${L2_LINEA_RPC_URL}"
    - chain-name: ethereum-mainnet
      url: "${L1_RPC_URL}"
