<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Direct Staking Watch</title>
<style>
:root {
  color-scheme: light;
  --page: #f6f5f0;
  --surface: #ffffff;
  --tint: #eef7f1;
  --ink: #10201a;
  --ink-2: #4c5a53;
  --muted: #8a938d;
  --line: #e6e4dc;
  --line-soft: #eeece5;
  --accent: #0e7a56;
  --dark: #101915;
  --ok-bg: #e9f5ee;   --ok-bd: #cbe7d6;   --ok-fg: #0b6b45;
  --warn-bg: #fdf3dc; --warn-bd: #f2dfb0; --warn-fg: #8a6100;
  --crit-bg: #fbebe9; --crit-bd: #f2cdc8; --crit-fg: #b3261e;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  background-image:
    linear-gradient(var(--line-soft) 1px, transparent 1px),
    linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
  background-size: 32px 32px;
}
.serif { font-family: "Iowan Old Style", "Palatino", Georgia, serif; }

/* ── App bar ── */
.appbar {
  display: flex; align-items: center; gap: 12px;
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding: 12px 28px;
}
.logo {
  width: 36px; height: 36px; border-radius: 9px; background: var(--dark);
  color: #fff; display: grid; place-items: center; font-size: 16px;
}
.appbar h1 { font-size: 16px; margin: 0; }
.appbar .subtitle { color: var(--muted); font-size: 12px; }
.appbar .right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
#updated { color: var(--ink-2); font-size: 13px; }
button.refresh {
  font: inherit; font-weight: 600; padding: 8px 16px; border-radius: 9px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
}
button.refresh:hover { border-color: var(--muted); }

.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot.ok { background: #2aa96e; } .dot.warn { background: #d9a422; } .dot.crit { background: #d64a3a; }
#rpcstat { display: inline-flex; align-items: center; gap: 7px; color: var(--ink-2); font-size: 13px; }

/* ── Layout ── */
main { max-width: 1240px; margin: 0 auto; padding: 26px 28px 40px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: 0 1px 2px rgba(16,32,26,.04);
  margin-bottom: 22px; overflow: hidden;
}

/* ── Hero ── */
.hero { display: grid; grid-template-columns: 1.6fr 1fr 1fr 1fr; }
.hero > div { padding: 22px 26px; border-left: 1px solid var(--line); }
.hero > div:first-child { border-left: none; }
.overline { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
.hero h2 { font-size: 30px; margin: 6px 0 8px; font-weight: 600; }
.hero p { margin: 0; color: var(--ink-2); font-size: 13px; max-width: 46ch; }
.stat .k { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.stat .v { font-size: 40px; line-height: 1.15; margin-top: 8px; }
.stat .s { color: var(--ink-2); font-size: 12px; margin-top: 4px; }
.stat.tinted { background: var(--tint); }
.stat.critical { background: var(--crit-bg); }
.stat.critical .v { color: var(--crit-fg); }

/* ── Matrix ── */
.card-head { display: flex; align-items: baseline; gap: 10px; padding: 18px 26px 4px; }
.card-head h3 { margin: 0; font-size: 16px; }
.card-head .desc { color: var(--muted); font-size: 12.5px; }
.legend { margin-left: auto; display: flex; gap: 16px; font-size: 12px; color: var(--ink-2); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
table { border-collapse: collapse; width: 100%; }
th {
  text-align: left; font-size: 11px; letter-spacing: .09em; text-transform: uppercase;
  color: var(--muted); font-weight: 600; padding: 14px 12px 8px; border-bottom: 1px solid var(--line);
}
td { padding: 12px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
th:first-child, td:first-child { padding-left: 26px; }
th:last-child, td:last-child { padding-right: 26px; }

.who { display: flex; align-items: center; gap: 12px; white-space: nowrap; }
.avatar {
  width: 34px; height: 34px; border-radius: 9px; flex: none;
  border: 1px solid var(--line); background: var(--page);
  display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--ink-2);
}
.who .name { font-weight: 650; }
.who .sub, .mono { font-size: 12px; color: var(--muted); font-family: ui-monospace, "SF Mono", Menlo, monospace; }
.who a { color: var(--muted); text-decoration: none; }
.who a:hover { color: var(--accent); }

.chip {
  display: inline-block; border-radius: 9px; padding: 6px 10px; border: 1px solid;
  font-variant-numeric: tabular-nums;
}
.syncm .chip, .ownm .chip { width: 182px; }
.chip .m, .chip .s { overflow: hidden; text-overflow: ellipsis; }
a.chiplink { text-decoration: none; }
a.chiplink:hover .chip { border-color: var(--accent); }
.num { font-variant-numeric: tabular-nums; }
.num .m { font-weight: 650; font-size: 15px; white-space: nowrap; }
.num .s { font-size: 11.5px; color: var(--muted); white-space: nowrap; margin-top: 1px; }
tr.group td { background: #fafaf8; border-bottom: 1px solid var(--line); padding: 8px 12px; font-size: 12px; }
tr.group .gname { font-weight: 700; font-size: 12.5px; }
tr.group a, .who a { text-decoration: none; }
tr.group a { color: var(--muted); font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; }
tr.group a:hover { color: var(--accent); }
.chip .m { font-weight: 650; font-size: 13px; white-space: nowrap; }
.chip .s { font-size: 11.5px; margin-top: 1px; white-space: nowrap; }
.chip.ok   { background: var(--ok-bg);   border-color: var(--ok-bd);   color: var(--ok-fg); }
.chip.ok .s { color: #4c8068; }
.chip.warn { background: var(--warn-bg); border-color: var(--warn-bd); color: var(--warn-fg); }
.chip.warn .s { color: #a5854a; }
.chip.crit { background: var(--crit-bg); border-color: var(--crit-bd); color: var(--crit-fg); }
.chip.crit .s { color: #c07a70; }

.rowlabel { font-weight: 600; white-space: nowrap; }
.rowlabel .sub { display: block; font-weight: 400; font-size: 11.5px; color: var(--muted); }

.err-banner { margin: 12px 26px 6px; padding: 12px 16px; border-radius: 10px;
  background: var(--crit-bg); border: 1px solid var(--crit-bd); color: var(--crit-fg); font-size: 13px; font-weight: 600; }
.chip .mono { color: inherit; font-size: inherit; }
.hico { vertical-align: -1px; margin: 0 1px; }

footer {
  max-width: 1240px; margin: 0 auto; padding: 0 28px 40px;
  display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap;
  color: var(--muted); font-size: 12px;
}
.scroll-x { overflow-x: auto; }
@media (max-width: 980px) { .hero { grid-template-columns: 1fr 1fr; } .hero > div { border-top: 1px solid var(--line); } }
</style>
</head>
<body>

<div class="appbar">
  <div class="logo">⇄</div>
  <div>
    <h1>Direct Staking Watch</h1>
    <div class="subtitle">Onchain operations console</div>
  </div>
  <div class="right">
    <span id="rpcstat"></span>
    <span id="updated">loading…</span>
    <button class="refresh" id="refresh">⟳ Refresh</button>
  </div>
</div>

<main id="main"></main>

<footer>
  <span>◷ Auto-refreshes every 60 seconds · read-only <span class="mono">eth_call</span> against public RPCs</span>
</footer>

<script>
// ── Anchors (config/state/*.inputs.yaml + *.deployed.yaml) ──────────────────
const LOL        = '0xfc832da3d688352c0ab1a32136c7fabbb16d66e6'; // l2LiquidityOwner (LOL Safe)
const AUTO_OWNER = '0xbdf111fec2e818ad9c76fbbae46144746ad55773'; // l2AutomationOwner
const DAO_AGENT  = '0x3e40d73eb977dc6a537af587d48316fee66e9c8c'; // Lido DAO Agent
const SYNC_ROLE  = '0xbb1ef2b79fa8154a13ffa50bd30e5f91ed93ff9b924bd04be671240cbc9d4b71'; // keccak256("SYNC_ROLE")
const ADMIN_ROLE = '0x' + '0'.repeat(64);
const TRIGGER_SYNC_SEL = '0x340b2b0b'; // triggerSync()

const NAMES = {
  [LOL]: 'LOL Safe', [AUTO_OWNER]: 'Automation Owner',
  [DAO_AGENT]: 'DAO Agent', ['0x' + '0'.repeat(40)]: 'zero',
};
const EOAS = new Set([AUTO_OWNER]);
const SAFES = new Set([LOL]);
// Holder-kind marks: person = EOA, two people = Safe multisig, document = contract.
const ICO = {
  eoa: '<svg class="hico" viewBox="0 0 16 16" width="11" height="11" fill="currentColor" aria-label="EOA"><circle cx="8" cy="4.5" r="3"/><path d="M8 8.5c-3.3 0-6 2-6 4.5V14h12v-1c0-2.5-2.7-4.5-6-4.5z"/></svg>',
  safe: '<svg class="hico" viewBox="0 0 20 16" width="13" height="11" fill="currentColor" aria-label="Safe multisig"><circle cx="7" cy="4.5" r="3"/><path d="M7 8.5c-3.3 0-6 2-6 4.5V14h12v-1c0-2.5-2.7-4.5-6-4.5z"/><circle cx="15" cy="5" r="2.4"/><path d="M15 8.8c-.7 0-1.4.1-2 .3 1.2 1 2 2.3 2 3.9v1h4v-1c0-1.9-1.7-3.5-4-4.2z"/></svg>',
  contract: '<svg class="hico" viewBox="0 0 16 16" width="11" height="11" fill="currentColor" aria-label="contract"><path fill-rule="evenodd" d="M3.5 1H10l3 3v11H3.5V1zm5.5 1.2V5h2.8L9 2.2z"/></svg>',
};
const holderKind = a => EOAS.has(a) ? 'eoa' : SAFES.has(a) ? 'safe' : 'contract';
const holder = (a, name) => `${ICO[holderKind((a || '').toLowerCase())]} ${name ?? who(a)}`;

// ponytail: RPC endpoints hardcoded; edit here if publicnode misbehaves.
const L1 = {
  name: 'Ethereum', tag: 'L1', abbr: 'ET', rpc: 'https://ethereum-rpc.publicnode.com', explorer: 'https://etherscan.io',
  receiver: '0x6F357d53d6bE3238180316BA5F8f11467e164588',
  proxyAdmin: '0x88a45d2760b63c1500E3D2E3552b28e5Cdaa37BD',
  wsteth: '0x7f39C581F595B53c5cb19bD0b3f8dA6c935E2Ca0',
  steth: '0xae7ab96520DE3A18E5e111B5EaAb095312D7fE84',
};

const COMMON_DEPLOYED = { // identical on all four lanes (deterministic deploys)
  pool: '0xac143bF41BBA4a8014b4Ef5a5F46b39a36AE40A8',
  syncTrigger: '0x871a5cddE9813627Ff37A2895A0c9B117A664622',
  creReceiver: '0x09BdB4E8BA68d245DCb1c6fbEb1e4f13b57cc69A',
  retiredSyncTrigger: '0x1594705D5f9BbDb36453ACF15C94d041c0E02c62',
};

const LANES = [
  { name: 'Optimism', abbr: 'OP', rpc: 'https://optimism-rpc.publicnode.com', explorer: 'https://optimistic.etherscan.io',
    sender: '0x328de900860816d29D1367F6903a24D8ed40C997', proxyAdmin: '0x4c8c4A15c1e810e481c412A9B06Be5f79dC02192',
    gov: '0xEfa0dB536d2c8089685630fafe88CF7805966FC3', oldAutomation: '0x3776CC14ce997827F7A87091018Daa1739dc2790',
    oldPool: '0x6F357d53d6bE3238180316BA5F8f11467e164588', creForwarder: '0xF8344CFd5c43616a4366C34E3EEE75af79a74482',
    weth: '0x4200000000000000000000000000000000000006', wsteth: '0x1F32b1c2345538c0c6f582fCB022739c4A194Ebb' },
  { name: 'Arbitrum', abbr: 'AR', rpc: 'https://arbitrum-one-rpc.publicnode.com', explorer: 'https://arbiscan.io',
    sender: '0x72229141D4B016682d3618ECe47c046f30Da4AD1', proxyAdmin: '0x5B42aEbFe95247f1d22e282831e2A513bF050217',
    gov: '0x1dcA41859Cd23b526CBe74dA8F48aC96e14B1A29', oldAutomation: '0x7EbD06BF137077fF5EE858ca6368dBd95DB7c66A',
    oldPool: '0x9c27c304cFdf0D9177002ff186A4aE0A5489Aace', creForwarder: '0xF8344CFd5c43616a4366C34E3EEE75af79a74482',
    weth: '0x82aF49447D8a07e3bd95BD0d56f35241523fBab1', wsteth: '0x5979D7b546E38E414F7E9822514be443A4800529' },
  { name: 'Base', abbr: 'BA', rpc: 'https://base-rpc.publicnode.com', explorer: 'https://basescan.org',
    sender: '0x328de900860816d29D1367F6903a24D8ed40C997', proxyAdmin: '0x4c8c4A15c1e810e481c412A9B06Be5f79dC02192',
    gov: '0x0E37599436974a25dDeEdF795C848d30Af46eaCF', oldAutomation: '0x3776CC14ce997827F7A87091018Daa1739dc2790',
    oldPool: '0x6F357d53d6bE3238180316BA5F8f11467e164588', creForwarder: '0xF8344CFd5c43616a4366C34E3EEE75af79a74482',
    weth: '0x4200000000000000000000000000000000000006', wsteth: '0xc1CBa3fCea344f92D9239c08C0568f6F2F0ee452' },
  { name: 'Linea', abbr: 'LI', rpc: 'https://linea-rpc.publicnode.com', explorer: 'https://lineascan.build',
    sender: '0x328de900860816d29D1367F6903a24D8ed40C997', proxyAdmin: '0x4c8c4A15c1e810e481c412A9B06Be5f79dC02192',
    gov: '0x74Be82F00CC867614803ffd7f36A2a4aF0405670', oldAutomation: '0x9c27c304cFdf0D9177002ff186A4aE0A5489Aace',
    oldPool: '0x6F357d53d6bE3238180316BA5F8f11467e164588', creForwarder: '0x9eF6468C5f37b976E57d52054c693269479A784d',
    weth: '0xe5D7C2a44FfDDf6b295A15c148167daaAf5Cf34f', wsteth: '0xB5beDd42000b71FddE22D3eE8a79Bd49A568fC8F' },
].map(l => ({ ...l, ...COMMON_DEPLOYED }));

// ── Minimal ABI plumbing ─────────────────────────────────────────────────────
const SEL = {
  owner: '0x8da5cb5b', getForwarder: '0xa0042526', getExpectedAuthor: '0x3397cf67',
  getOraclePool: '0x37d86246', getLastExecution: '0x7acd7f48', getDelay: '0xcebc9a82',
  getAmounts: '0x3d370b4e', getMaxFees: '0x77c46f80', shouldSyncAmount: '0x755b53a3',
  canSync: '0x269d5486', hasRole: '0x91d14854', balanceOf: '0x70a08231', isCallAllowed: '0x797c8d69',
};
const pad = a => a.toLowerCase().replace('0x', '').padStart(64, '0');
const call = (to, data) => ({ method: 'eth_call', params: [{ to, data }, 'latest'] });
const bal = a => ({ method: 'eth_getBalance', params: [a, 'latest'] });
const decAddr = h => h && h.length >= 66 ? '0x' + h.slice(-40) : null;
const decBool = h => h ? BigInt(h) !== 0n : null;
const decU = h => h ? BigInt(h) : null;

async function rpcBatch(url, calls) {
  const body = calls.map((c, i) => ({ jsonrpc: '2.0', id: i, ...c }));
  const res = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const out = await res.json();
  const byId = new Map(out.map(r => [r.id, r]));
  return calls.map((_, i) => byId.get(i)?.result ?? null); // per-call revert → null
}

// ── Formatting ───────────────────────────────────────────────────────────────
const fmtEth = (wei, dp = 4) => wei == null ? '—' : (Number(wei) / 1e18).toLocaleString('en-US', { maximumFractionDigits: dp });
const short = a => a ? a.slice(0, 6) + '…' + a.slice(-4) : '—';
const who = a => a ? (NAMES[a.toLowerCase()] || short(a)) : '—';
function ago(ts) {
  if (ts == null) return '—';
  let s = Math.max(0, Math.floor(Date.now() / 1000) - Number(ts));
  const d = Math.floor(s / 86400); s %= 86400;
  const h = Math.floor(s / 3600); const m = Math.floor(s % 3600 / 60);
  return (d ? d + 'd ' : '') + (h ? h + 'h ' : '') + (d ? '' : m + 'm ') + 'ago';
}
const worst = levels => levels.includes('crit') ? 'crit' : levels.includes('warn') ? 'warn' : 'ok';
const chip = (level, main, sub) =>
  `<span class="chip ${level}"><div class="m">${level === 'ok' ? '✓ ' : level === 'warn' ? '⚠ ' : level === 'crit' ? '✕ ' : ''}${main}</div>${sub ? `<div class="s">${sub}</div>` : ''}</span>`;
const alink = (net, a, text) => `<a href="${net.explorer}/address/${a}" target="_blank" title="${a}">${text ?? short(a)}&thinsp;↗</a>`;

// Owner matches the target → ok; anything else → crit (migration is complete).
function ownerCheck(actual, target) {
  if (!actual) return ['crit', 'unreadable'];
  return [target.toLowerCase() === actual.toLowerCase() ? 'ok' : 'crit', holder(actual)];
}

// ── Data ─────────────────────────────────────────────────────────────────────
async function laneData(L) {
  const q = [
    call(L.sender, SEL.getOraclePool),                                   // 0
    call(L.sender, SEL.hasRole + pad(ADMIN_ROLE) + pad(L.gov)),          // 1
    call(L.sender, SEL.hasRole + pad(SYNC_ROLE) + pad(L.syncTrigger)),   // 2
    call(L.sender, SEL.hasRole + pad(SYNC_ROLE) + pad(L.retiredSyncTrigger)), // 3
    call(L.sender, SEL.hasRole + pad(SYNC_ROLE) + pad(L.oldAutomation)), // 4
    call(L.proxyAdmin, SEL.owner),                                       // 5
    call(L.syncTrigger, SEL.owner),                                      // 6
    call(L.syncTrigger, SEL.getForwarder),                               // 7
    call(L.syncTrigger, SEL.getLastExecution),                           // 8
    call(L.syncTrigger, SEL.getDelay),                                   // 9
    call(L.syncTrigger, SEL.getAmounts),                                 // 10
    call(L.syncTrigger, SEL.getMaxFees),                                 // 11
    call(L.syncTrigger, SEL.shouldSyncAmount),                           // 12
    call(L.syncTrigger, SEL.canSync),                                    // 13
    call(L.creReceiver, SEL.owner),                                      // 14
    call(L.creReceiver, SEL.getForwarder),                               // 15
    call(L.creReceiver, SEL.getExpectedAuthor),                          // 16
    call(L.creReceiver, SEL.isCallAllowed + pad(L.syncTrigger) + TRIGGER_SYNC_SEL.replace('0x', '').padEnd(64, '0')), // 17
    call(L.pool, SEL.owner),                                             // 18
    call(L.weth, SEL.balanceOf + pad(L.pool)),                           // 19
    call(L.wsteth, SEL.balanceOf + pad(L.pool)),                         // 20
    bal(L.syncTrigger),                                                  // 21
  ];
  const r = await rpcBatch(L.rpc, q);
  return {
    wiredPool: decAddr(r[0]), govIsAdmin: decBool(r[1]),
    triggerHasRole: decBool(r[2]), retiredHasRole: decBool(r[3]), oldAutoHasRole: decBool(r[4]),
    proxyOwner: decAddr(r[5]), stOwner: decAddr(r[6]), stForwarder: decAddr(r[7]),
    lastExec: decU(r[8]), delay: decU(r[9]),
    minAmount: r[10] ? BigInt('0x' + r[10].slice(2, 66)) : null,
    maxAmount: r[10] ? BigInt('0x' + r[10].slice(66, 130)) : null,
    maxFees: decU(r[11]), shouldSync: decU(r[12]), canSync: decBool(r[13]),
    creOwner: decAddr(r[14]), creForwarderActual: decAddr(r[15]), creAuthor: decAddr(r[16]),
    callAllowed: decBool(r[17]), poolOwner: decAddr(r[18]),
    poolWeth: decU(r[19]), poolWsteth: decU(r[20]), float: decU(r[21]),
  };
}

async function l1Data() {
  const q = [
    call(L1.receiver, SEL.hasRole + pad(ADMIN_ROLE) + pad(DAO_AGENT)),  // 0
    call(L1.proxyAdmin, SEL.owner),                                     // 1
    bal(L1.receiver),                                                   // 2
    call(L1.wsteth, SEL.balanceOf + pad(L1.receiver)),                  // 3
    call(L1.steth, SEL.balanceOf + pad(L1.receiver)),                   // 4
  ];
  const r = await rpcBatch(L1.rpc, q);
  return { daoIsAdmin: decBool(r[0]), proxyOwner: decAddr(r[1]),
           eth: decU(r[2]), wsteth: decU(r[3]), steth: decU(r[4]) };
}

// ── Derivations ──────────────────────────────────────────────────────────────
// Checks grouped by the contract they read from (group.addr → explorer link).
function laneGroups(L, d) {
  const eq = (a, b) => a && a.toLowerCase() === b.toLowerCase();
  const cell = ([level, value], a) => ({ level, value, a: a ? a.toLowerCase() : null }); // a → holder address, linked in the matrix
  const syncRole = d.retiredHasRole || d.oldAutoHasRole ? ['crit', 'legacy holder'] // revoked at migration; a regrant = compromise
    : d.triggerHasRole ? ['ok', 'SyncTrigger'] : ['crit', 'missing'];
  return [
    { contract: 'CustomSender', addr: L.sender, checks: [
      { key: 'wired pool', sub: 'getOraclePool()', ...cell(eq(d.wiredPool, L.pool) ? ['ok', holder(L.pool, 'OraclePool')] : ['crit', holder(d.wiredPool)], d.wiredPool) },
      { key: 'admin', sub: 'DEFAULT_ADMIN_ROLE', ...cell(d.govIsAdmin ? ['ok', holder(L.gov, 'Gov Executor')] : ['crit', 'not Gov Executor'], d.govIsAdmin ? L.gov : null) },
      { key: 'sync role', sub: 'hasRole(SYNC_ROLE)', ...cell(syncRole[1] === 'SyncTrigger' ? [syncRole[0], holder(L.syncTrigger, 'SyncTrigger')] : syncRole, L.syncTrigger) },
    ] },
    { contract: 'ProxyAdmin', addr: L.proxyAdmin, checks: [
      { key: 'owner', sub: 'owner()', ...cell(eq(d.proxyOwner, L.gov) ? ['ok', holder(L.gov, 'Gov Executor')] : ['crit', holder(d.proxyOwner)], d.proxyOwner) },
    ] },
    { contract: 'SyncTrigger', addr: L.syncTrigger, checks: [
      { key: 'owner', sub: 'owner()', ...cell(ownerCheck(d.stOwner, AUTO_OWNER), d.stOwner) },
      { key: 'forwarder', sub: 'getForwarder()', ...cell(eq(d.stForwarder, L.creReceiver) ? ['ok', holder(L.creReceiver, 'CREReceiver')] : ['crit', holder(d.stForwarder)], d.stForwarder) },
    ] },
    { contract: 'CREReceiver', addr: L.creReceiver, checks: [
      { key: 'owner', sub: 'owner()', ...cell(ownerCheck(d.creOwner, AUTO_OWNER), d.creOwner) },
      { key: 'forwarder', sub: 'getForwarder()', ...cell(eq(d.creForwarderActual, L.creForwarder) ? ['ok', holder(L.creForwarder, 'CRE Forwarder')] : ['crit', holder(d.creForwarderActual)], d.creForwarderActual) },
      { key: 'expected author', sub: 'getExpectedAuthor()', ...cell(ownerCheck(d.creAuthor, AUTO_OWNER), d.creAuthor) },
      { key: 'triggerSync allowed', sub: 'isCallAllowed()', ...cell(d.callAllowed ? ['ok', 'allowed'] : ['crit', 'blocked']) },
    ] },
    { contract: 'OraclePool', addr: L.pool, checks: [
      { key: 'owner', sub: 'owner()', ...cell(ownerCheck(d.poolOwner, LOL), d.poolOwner) },
    ] },
  ];
}
const laneChecks = (L, d) => laneGroups(L, d).flatMap(g => g.checks);

// Why canSync() is false — same gates the contract checks, named from data we already read.
function canSyncCause(d) {
  if (d.triggerHasRole === false) return 'SYNC_ROLE lost';
  if (d.float != null && d.maxFees != null && d.float < d.maxFees) return 'float below maxFees';
  return 'pool paused'; // the only remaining canSync gate
}

function syncState(d) {
  if (d.shouldSync == null || d.canSync == null) return ['crit', 'UNREADABLE', 'probe failed'];
  if (d.shouldSync > 0n && !d.canSync) return ['crit', 'BLOCKED', fmtEth(d.shouldSync, 2) + ' WETH due — ' + canSyncCause(d)];
  if (d.shouldSync > 0n) return ['warn', 'DUE', fmtEth(d.shouldSync, 2) + ' WETH, awaiting DON'];
  if (!d.canSync) return ['warn', 'IMPAIRED', canSyncCause(d)];
  if (d.delay != null && d.lastExec != null && BigInt(Math.floor(Date.now() / 1000)) < d.lastExec + d.delay)
    return ['ok', 'COOLDOWN', 'delay window active'];
  return ['ok', 'IDLE', 'pool below min amount'];
}

function floatState(d) {
  if (d.float == null || d.maxFees == null || d.maxFees === 0n) return { level: 'crit', x: null };
  const x = Number(d.float) / Number(d.maxFees);
  return { level: x >= 2 ? 'ok' : x >= 1 ? 'warn' : 'crit', x };
}

const laneLevel = lane => lane.error ? 'crit' :
  worst([syncState(lane.d)[0], floatState(lane.d).level, ...laneChecks(lane.L, lane.d).map(c => c.level)]);

function l1Checks(d) {
  const balRow = (label, v) => ({
    key: label,
    ...(v == null ? { level: 'crit', value: 'unreadable', sub: '' }
      : v > 10n ** 18n ? { level: 'crit', value: fmtEth(v) + ' ETH', sub: 'parked > 1' }
      : v > 10n ** 12n ? { level: 'warn', value: fmtEth(v, 6), sub: 'transient?' }
      : { level: 'ok', value: '~0', sub: 'as expected' }),
  });
  const [pl, pv] = ownerCheck(d.proxyOwner, DAO_AGENT);
  return [
    { key: 'Receiver admin', level: d.daoIsAdmin ? 'ok' : 'crit',
      value: d.daoIsAdmin ? holder(DAO_AGENT) : 'not DAO Agent', sub: 'DEFAULT_ADMIN_ROLE' },
    { key: 'ProxyAdmin owner', level: pl, value: pv, sub: 'owner()' },
    balRow('Receiver ETH', d.eth), balRow('Receiver wstETH', d.wsteth), balRow('Receiver stETH', d.steth),
  ];
}

// ── Render ───────────────────────────────────────────────────────────────────
function render(l1, lanes) {
  const l1Level = l1.error ? 'crit' : worst(l1Checks(l1.d).map(c => c.level));
  const levels = { [L1.name]: l1Level };
  lanes.forEach(l => levels[l.L.name] = laneLevel(l));

  const rpcOk = [l1, ...lanes].filter(x => !x.error).length;
  document.getElementById('rpcstat').innerHTML =
    `<span class="dot ${rpcOk === 5 ? 'ok' : 'crit'}"></span> RPC ${rpcOk}/5`;

  // hero numbers
  const live = lanes.filter(l => !l.error);
  const crits = Object.values(levels).filter(l => l === 'crit').length;
  const warns = Object.values(levels).filter(l => l === 'warn').length;
  const healthy = LANES.length - lanes.filter(l => laneLevel(l) === 'crit').length;
  const totalWeth = live.reduce((s, l) => s + (l.d.poolWeth ?? 0n), 0n);
  const floats = live.map(l => ({ name: l.L.name, ...floatState(l.d) })).filter(f => f.x != null);
  const lowFloat = floats.length ? floats.reduce((a, b) => a.x < b.x ? a : b) : null;

  const hero = `<div class="card hero">
    <div>
      <div class="overline">Mainnet status</div>
      <h2 class="serif">Sync &amp; custody</h2>
      <p>L2 pools accumulate WETH; SyncTrigger sends it to L1 for staking via CCIP and wstETH bridges back. Every value is read on-chain.</p>
    </div>
    <div class="stat">
      <div class="k">Lanes healthy</div>
      <div class="v serif">${healthy}<span style="color:var(--muted)">/${LANES.length}</span></div>
      <div class="s">${crits ? crits + ' critical' : 'no critical lanes'}${warns ? ' · ' + warns + ' warn' : ''}</div>
    </div>
    <div class="stat tinted">
      <div class="k">Pool WETH</div>
      <div class="v serif">${fmtEth(totalWeth, 2)}</div>
      <div class="s">across 4 lanes · awaiting sync</div>
    </div>
    <div class="stat ${lowFloat && lowFloat.x < 1 ? 'critical' : 'tinted'}">
      <div class="k">Lowest fee float</div>
      <div class="v serif">${lowFloat ? lowFloat.x.toFixed(2) + '×' : '—'}</div>
      <div class="s">${lowFloat ? lowFloat.name + ' · of getMaxFees(), sync needs ≥ 1×' : 'no data'}</div>
    </div>
  </div>`;

  // sync matrix
  const num = (m, s) => `<span class="num"><div class="m">${m}</div><div class="s">${s}</div></span>`;
  const syncRows = lanes.map(l => {
    if (l.error) return `<tr><td>${laneWho(l.L)}</td><td colspan="5"><span class="chip crit"><div class="m">✕ RPC error</div><div class="s">${l.error}</div></span></td></tr>`;
    const d = l.d, [slv, sm, ss] = syncState(d), f = floatState(d);
    const checks = laneChecks(l.L, d);
    const okCount = checks.filter(c => c.level === 'ok').length;
    return `<tr>
      <td>${laneWho(l.L)}</td>
      <td>${chip(slv, sm, slv === 'ok' ? 'last sync ' + ago(d.lastExec) : ss)}</td>
      <td>${num(fmtEth(d.poolWeth, 2) + ' WETH', d.minAmount != null ? `min ${fmtEth(d.minAmount, 0)} · max ${fmtEth(d.maxAmount, 0)}` : '—')}</td>
      <td>${num(fmtEth(d.poolWsteth, 2) + ' wstETH', 'fastStake liquidity')}</td>
      <td>${chip(f.level, f.x != null ? f.x.toFixed(2) + '× maxFees' : '—', fmtEth(d.float) + ' ETH on trigger')}</td>
      <td>${chip(worst(checks.map(c => c.level)), okCount + '/' + checks.length + ' checks', 'owners &amp; wiring')}</td>
    </tr>`;
  }).join('');

  const syncCard = `<div class="card">
    <div class="card-head">
      <h3>Sync Matrix</h3><span class="desc">Per-lane liveness from SyncTrigger and the oracle pool.</span>
      ${legendHtml()}
    </div>
    <div class="scroll-x"><table class="syncm">
      <tr><th>Lane</th><th>Sync state</th><th>Pool WETH</th><th>Pool wstETH</th><th>Fee float</th><th>Access control</th></tr>
      ${syncRows}
    </table></div>
  </div>`;

  // ownership matrix: rows = checks grouped by contract, columns = lanes.
  // These are tripwires, not daily reads — deviations surface on top, the green wall folds away.
  const perLane = lanes.map(l => l.error ? null : laneGroups(l.L, l.d));
  const okLane = lanes.find(l => !l.error);
  const template = laneGroups(okLane?.L ?? LANES[0], okLane?.d ?? {});
  const laneAddrs = lanes.map(l => laneGroups(l.L, {}).map(g => g.addr));

  const checkRow = (gi, ci, row) => `<tr>
    <td class="rowlabel">${row.key}<span class="sub mono">${row.sub}</span></td>
    ${perLane.map((cs, li) => {
      if (!cs) return '<td>—</td>';
      const c = cs[gi].checks[ci];
      const inner = chip(c.level, c.value, c.a ? `<span class="mono">${short(c.a)}&thinsp;↗</span>` : null);
      return `<td>${c.a ? `<a class="chiplink" href="${lanes[li].L.explorer}/address/${c.a}" target="_blank" title="${c.a}">${inner}</a>` : inner}</td>`;
    }).join('')}
  </tr>`;
  const buildTable = filter => `<table class="ownm">
    <tr><th>Check</th>${lanes.map(l => `<th>${l.L.name}</th>`).join('')}</tr>
    ${template.map((g, gi) => {
      const rows = g.checks.map((row, ci) => ({ row, ci })).filter(({ ci }) => filter(gi, ci));
      if (!rows.length) return '';
      return `<tr class="group"><td class="gname">${g.contract}</td>` +
        lanes.map((l, li) => `<td><a href="${l.L.explorer}/address/${laneAddrs[li][gi]}" target="_blank" title="${laneAddrs[li][gi]}">${short(laneAddrs[li][gi])}&thinsp;↗</a></td>`).join('') +
        '</tr>' + rows.map(({ row, ci }) => checkRow(gi, ci, row)).join('');
    }).join('')}
  </table>`;

  const deviates = (gi, ci) => perLane.some(cs => cs && cs[gi].checks[ci].level !== 'ok');
  const nDev = template.flatMap((g, gi) => g.checks.filter((_, ci) => deviates(gi, ci))).length;
  const nChecks = template.reduce((s, g) => s + g.checks.length, 0);
  const unreachable = lanes.filter(l => l.error).map(l => l.L.name);
  const reachNote = unreachable.length ? ` · ${unreachable.join(', ')} unreachable` : '';

  const ownCard = `<div class="card">
    <div class="card-head">
      <h3>Ownership &amp; Wiring</h3><span class="desc">Every getter vs its target; any drift is critical. ${ICO.contract} contract · ${ICO.safe} Safe · ${ICO.eoa} EOA</span>
    </div>
    ${nDev ? `<div class="err-banner">✕ ${nDev} of ${nChecks} checks deviate from target${reachNote}</div>` : ''}
    <div class="scroll-x">${buildTable(() => true)}</div>
  </div>`;

  // L1 card
  const l1Body = l1.error
    ? `<div class="err-banner">RPC error: ${l1.error}</div>`
    : `<div class="scroll-x"><table class="ownm"><tr>${l1Checks(l1.d).map(c => `<th>${c.key}</th>`).join('')}</tr>
       <tr>${l1Checks(l1.d).map(c => `<td>${chip(c.level, c.value, c.sub)}</td>`).join('')}</tr></table></div>`;
  const l1Card = `<div class="card">
    <div class="card-head">
      <h3>Ethereum L1 — Shared Receiver</h3>
      <span class="desc">${alink(L1, L1.receiver, 'LidoCustomReceiver')} · ${alink(L1, L1.proxyAdmin, 'ProxyAdmin')} · balances are transient during a stake; parked funds are an incident.</span>
    </div>${l1Body}</div>`;

  document.getElementById('main').innerHTML = hero + syncCard + ownCard + l1Card;
  document.getElementById('updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
}

const legendHtml = () => `<span class="legend">
  <span><span class="dot ok"></span> ok</span>
  <span><span class="dot warn"></span> warn</span>
  <span><span class="dot crit"></span> critical</span></span>`;

const laneWho = L => `<span class="who">
  <span class="avatar">${L.abbr}</span>
  <span><span class="name">${L.name}</span><br>
  <span class="sub">${alink(L, L.syncTrigger, 'trigger')} · ${alink(L, L.pool, 'pool')}</span></span></span>`;

// ── Page loop ────────────────────────────────────────────────────────────────
async function refresh() {
  const [l1, ...lanes] = await Promise.all([
    l1Data().then(d => ({ d })).catch(e => ({ error: e.message })),
    ...LANES.map(L => laneData(L).then(d => ({ L, d })).catch(e => ({ L, error: e.message }))),
  ]);
  render(l1, lanes);
}
document.getElementById('refresh').onclick = refresh;
refresh();
setInterval(refresh, 60_000);
</script>
</body>
</html>
